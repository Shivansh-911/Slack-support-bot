# ---------------------------------------------------------------------
# New Relic Python Agent configuration file.
#
# Secrets/per-environment values (license key, app name) are deliberately
# NOT set here: the agent reads NEW_RELIC_LICENSE_KEY / NEW_RELIC_APP_NAME
# straight from the process environment (Railway service variables, or
# exported from .env locally). Don't add `license_key =` / `app_name =`
# lines — the agent parses this file with RawConfigParser, so a
# `%(env.VAR)s` placeholder is never expanded, and any value written here
# overrides the environment variable.
# This is a trimmed version of the `newrelic-admin generate-config`
# template; anything not listed below uses the agent's documented default.
# ---------------------------------------------------------------------

[newrelic]
monitor_mode = true
log_file = stdout
log_level = info
high_security = false

distributed_tracing.enabled = true
# Keep the full trace (waterfall) for every Slack question, not just the
# ~10/minute adaptive sampling would keep by default.
distributed_tracing.sampler.root = always_on

error_collector.enabled = true
error_collector.ignore_status_codes = 404

# SlackQuestion / CmaToolCall custom events carry the full question, tool
# inputs and error messages; allow up to 4095 bytes per value instead of
# the 255 default.
custom_insights_events.max_attribute_value = 4095

transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = apdex_f
transaction_tracer.record_sql = obfuscated

# Step timings inside each Slack question's trace. The CMA run itself
# (_drive) is one step; the tool calls inside it are timed separately by
# CmaToolCallMonitorService.
transaction_tracer.function_trace =
    slack.services.slack_event_dispatch_service:SlackEventDispatchService.handle
    slack.services.slack_event_listener_service:SlackEventListenerService._resolve_mention
    slack.services.slack_event_listener_service:SlackEventListenerService._resolve_followup_team
    slack.services.slack_event_listener_service:SlackEventListenerService.get_context
    slack.services.slack_event_listener_service:SlackEventListenerService._react
    slack.services.slack_event_listener_service:SlackEventListenerService._post
    agent.services.slack.slack_channel_service:SlackChannelService._fetch_id_to_name
    agent.services.agent_run:AgentRunService.handle_run
    agent.services.agent_run:AgentRunService._drive

# Bolt runs handle_message on its own thread pool after the web request has
# already returned Slack's 200, so the automatic web transaction never sees
# the real work. This wraps it in its own background transaction — one per
# Slack question, each with a fresh trace. SlackQuestionMonitorService
# renames it to SlackAgent/<team> once the team is known.
[background-task:slack-handle-message]
enabled = true
function = slack.services.slack_event_listener_service:SlackEventListenerService.handle_message
name = SlackAgent/handle_message
group = Slack
