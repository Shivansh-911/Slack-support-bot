name: Slack Support Agent
model: claude-sonnet-5

# slack-mcp-server is deployed on Railway (not tunneled from a local Docker
# Compose stack — see docker-compose.yml's comment on why). Paste its Railway
# domain in below with a trailing `/sse` — that's the path its default `sse`
# transport serves on (confirmed by testing; its `http` transport mode
# doesn't route anywhere in the current build). Whether CMA's `type: url` MCP
# connector actually accepts this legacy SSE transport, rather than only the
# Streamable HTTP transport its own docs describe, hasn't been confirmed yet
# — the first real session against this URL is the test.
# Asana is no longer wired here as an MCP server (asana-mcp/Dockerfile's Railway
# gateway) — it kept 502'ing. Its 18 read-only tools are now custom tools instead (see
# the `type: custom` entries below), executed by Django's AgentAsanaCustomToolService,
# which enforces constants.py's workspace/project whitelist itself before ever calling
# Asana — the same enforcement model already used for Slack's custom tools.
mcp_servers:
  - type: url
    name: slack
    url: https://slack-mcp-server-production-6be5.up.railway.app/sse

tools:
  - type: mcp_toolset
    mcp_server_name: slack
    default_config:
      enabled: false
      permission_policy:
        type: always_ask
    configs:
      # --- Read-only tools: enabled ---
      # Full inventory below cross-checked against korotovsky/slack-mcp-server
      # (master) pkg/server/server.go + pkg/handler/{conversations,channels,
      # usergroups,saved}.go directly, not just the README, on 2026-08-13.
      - name: conversations_history
        enabled: true
        permission_policy:
          type: always_ask
      - name: conversations_replies
        enabled: true
        permission_policy:
          type: always_ask
      - name: users_search
        enabled: true
        permission_policy:
          type: always_ask
      - name: channels_list
        enabled: true
        permission_policy:
          type: always_ask
      - name: conversations_unreads
        enabled: true
        permission_policy:
          type: always_ask
      - name: channels_me
        enabled: true
        permission_policy:
          type: always_ask
      - name: usergroups_list
        enabled: true
        permission_policy:
          type: always_ask
      - name: saved_list
        enabled: true
        permission_policy:
          type: always_ask
      # Read-only (fetches file content, no mutation), but the server itself
      # also gates this behind SLACK_MCP_ATTACHMENT_TOOL — enabling it here
      # doesn't do anything unless that env var is set on the Railway deploy.
      - name: attachment_get_data
        enabled: false
        permission_policy:
          type: always_ask

      # --- Read-only, but explicitly denied anyway: duplicates our custom
      #     `search_whitelisted_channels` tool below, which re-checks every
      #     result against constants.WHITELISTED_CHANNELS. This raw MCP tool
      #     has no such allowlist re-check, so it stays off even though it's
      #     read-only. ---
      - name: conversations_search_messages
        enabled: false
        permission_policy:
          type: always_ask

  # Custom tool: no MCP server runs this. The agent emits `agent.custom_tool_use`,
  # the session goes idle, and AgentCustomToolService (agent_run.py's
  # `_handle_event`) executes it and answers with `user.custom_tool_result` —
  # there is no permission_policy field because there is no confirmation step;
  # we're the ones running it. channel_ids/exclude_channel_ids are optional
  # and mutually exclusive: omitting both searches every whitelisted channel
  # (the default), channel_ids restricts to just those, and
  # exclude_channel_ids searches every whitelisted channel except those —
  # useful when the agent knows a channel's ID (it just dominated an unscoped
  # search) but not the IDs of the other whitelisted channels it would
  # otherwise need to list explicitly. Either way,
  # SlackChannelSearchAssistantService checks every ID involved against
  # constants.WHITELISTED_CHANNELS *before* ever calling Slack.
  #
  # This schema mirrors assistant.search.context
  # (https://docs.slack.dev/reference/methods/assistant.search.context)
  # parameter-for-parameter, with two deliberate deviations: `channel_types`
  # is dropped in favor of `channel_ids`/`exclude_channel_ids` (our own
  # allowlist-scoping mechanism, applied as `in:<#channel_id>` query
  # modifiers OR'd together and then re-checked against every returned
  # message afterward — that re-check, not the query text, is the real
  # boundary), and `content_types` is accepted but forced to `['messages']`
  # server-side regardless of what's passed in, because `files`/`channels`
  # results carry no channel_id field to re-check against the allowlist the
  # way messages are re-checked.
  #
  # AgentCustomToolService dispatches this tool name to
  # SlackChannelSearchAssistantService (`assistant.search.context`-based).
  # The older search.messages-based SlackChannelSearchService still exists
  # but is no longer wired to anything as of 2026-08-13.
  - type: custom
    name: search_whitelisted_channels
    description: >-
      Search Slack messages, with optional surrounding context, by free-text
      query. By default searches across every channel this agent is
      allowed to read. Pass channel_ids to restrict the search to one or
      more specific channels (results are pooled across all of them, so one
      busy channel won't crowd out the others). Pass exclude_channel_ids
      instead when one particular channel keeps dominating results with
      nothing relevant — e.g. two or more reformulated unscoped searches in a
      row where the same channel supplies most or all hits and none are
      on-topic — to search every other allowed channel without needing to
      know their IDs. channel_ids and exclude_channel_ids are mutually
      exclusive; passing both is rejected. Any channel_id outside this
      agent's allowlist, in either list, causes the whole call to be
      rejected before any Slack API call is made — try again with only
      allowed channel_ids, or drop the invalid entry from exclude_channel_ids
      and retry with the rest, rather than retrying unchanged. Supports
      Slack's search modifiers (`from:`, `before:`, `after:`, etc.) except
      `in:`, which is reserved for channel scoping and is applied
      automatically from channel_ids/exclude_channel_ids.
    input_schema:
      type: object
      properties:
        channel_ids:
          type: array
          items:
            type: string
          description: >-
            Optional. One or more Slack channel IDs to restrict the search
            to (e.g. ["C0123456789", "C0987654321"]) — each must be one
            this agent is allowed to read. When omitted, the search runs
            across every whitelisted channel instead (the default). Mutually
            exclusive with exclude_channel_ids.
        exclude_channel_ids:
          type: array
          items:
            type: string
          description: >-
            Optional. One or more Slack channel IDs to search every
            whitelisted channel EXCEPT — use this to drop a channel that
            keeps dominating results with irrelevant hits, without having to
            name every other allowed channel. Each ID must be one this agent
            is allowed to read. Mutually exclusive with channel_ids; if
            excluding every whitelisted channel would leave nothing to
            search, the call is rejected instead of silently returning
            nothing.
        query:
          type: string
          description: User prompt or free-text Slack search query.
        action_token:
          type: string
          description: >-
            Pass the action_token as received in a message event, if this
            search is following up on one.
        content_types:
          type: array
          items:
            type: string
            enum:
              - messages
          description: >-
            Content types to include. Fixed to `messages` — `files` and
            `channels` results have no channel_id to check against this
            agent's allowlist, so they are not supported here.
        include_bots:
          type: boolean
          description: Whether results should include bot messages.
        include_deleted_users:
          type: boolean
          description: Whether to include messages from deleted users.
        before:
          type: integer
          description: Unix timestamp filter — only return results before this time.
        after:
          type: integer
          description: Unix timestamp filter — only return results after this time.
        include_context_messages:
          type: boolean
          description: Whether to include the messages surrounding each main result.
        cursor:
          type: string
          description: Pagination cursor from a previous call's next_cursor, to fetch the next page.
        limit:
          type: integer
          description: Number of results to return, up to a max of 20.
        sort:
          type: string
          enum:
            - score
            - timestamp
          description: Field to sort results by.
        sort_dir:
          type: string
          enum:
            - asc
            - desc
          description: Sort direction.
        include_message_blocks:
          type: boolean
          description: Whether to return Block Kit blocks for each message result.
        highlight:
          type: boolean
          description: Whether to highlight the matched query terms in results.
        term_clauses:
          type: array
          items:
            type: object
          description: >-
            A list of term clauses. Returned results match every term
            clause specified.
        modifiers:
          type: string
          description: Modifiers in `modifier:value` format, affecting term_clauses.
        include_archived_channels:
          type: boolean
          description: Whether to include archived channels in results.
        disable_semantic_search:
          type: boolean
          description: When true, only keyword-based search is used (no semantic search).
      required:
        - query

  # Custom tools backing name resolution: `users_search` (the MCP tool above)
  # is exact-substring-only against name/real_name/display_name/email, and
  # hard-requires a non-empty query — no way to enumerate everyone through it.
  # These two exist for what that tool can't do: SlackUserSearchAssistantService
  # (Django) keeps its own `users.list`-backed directory cache, tried as an
  # exact substring match first (same semantics as users_search) and only
  # falling back to fuzzy/typo-tolerant matching when that comes back empty —
  # so a misspelling or short form that isn't literally a substring of anyone's
  # profile still has a chance to resolve. The full directory is never handed
  # to the agent, only the specific matches for its query, for the same reason
  # `channels_list` isn't exposed as a raw enumeration tool.
  #
  # Requires the Slack token to have `users:read`, `users:read.email`, and
  # `channels:read`/`groups:read` scopes (for `users.list` and
  # `conversations.members` respectively) — if either 403s, these tools error
  # out rather than silently returning nothing.
  - type: custom
    name: search_users_directory
    description: >-
      Search the workspace's user directory by name, handle, or email — the
      fallback for when users_search returns nothing. Tries an exact
      substring match first (same as users_search); if that finds nothing, it
      retries with fuzzy/typo-tolerant matching, so a misspelling or a short
      form that isn't a literal substring of anyone's profile still has a
      chance to resolve (a nickname unrelated to the real name, like "Bob"
      for "Robert", still won't — there is no nickname dictionary). Results
      are tagged exact or fuzzy; treat fuzzy matches as tentative and confirm
      with the user before acting on one if it matters who exactly they are.
      Pass channel_id to also see whether each match is currently a member of
      that channel — a disambiguation signal when a name matches more than
      one person, not a filter; someone who left the channel still appears,
      just flagged as not currently in it.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Name, handle, or email fragment to search for.
        channel_id:
          type: string
          description: >-
            Optional. A whitelisted channel ID or name to check each match's
            current membership against, for disambiguation. Rejected before
            any Slack API call if it isn't one this agent is allowed to read.
        limit:
          type: integer
          description: Maximum results to return, up to 10 (the default).
      required:
        - query

  - type: custom
    name: list_channel_members
    description: >-
      List the current members of one whitelisted channel, with real names
      attached (not bare IDs) — closes the "who's in this channel" gap that
      no other tool here answers. Membership is a point-in-time snapshot;
      someone who left recently may still be relevant to older history in
      that channel, so don't treat absence from this list as proof someone
      never participated there.
    input_schema:
      type: object
      properties:
        channel_id:
          type: string
          description: >-
            A whitelisted channel ID or name. Rejected before any Slack API
            call if it isn't one this agent is allowed to read.
      required:
        - channel_id

  # Resolves a whitelisted channel_id to its channel name. Most tool output
  # already carries a channel name alongside any channel_id it returns (e.g.
  # search_whitelisted_channels results), so this is only needed for the
  # remaining cases that surface a bare ID — conversations_history/
  # conversations_replies results, or a channel_id named in a tool
  # confirmation denial. Every message the agent receives already carries the
  # current channel's own name in its Slack context header (see system
  # prompt below); this tool is for *other* channel_ids encountered mid-task.
  - type: custom
    name: resolve_channel_name
    description: >-
      Resolve a whitelisted Slack channel ID to its channel name. Use this
      when a tool result surfaces a channel_id that isn't already paired
      with a name and you need the readable name to reference it in your
      answer. Only resolves channel IDs on this agent's allowlist — any
      other ID is rejected rather than resolved.
    input_schema:
      type: object
      properties:
        channel_id:
          type: string
          description: The Slack channel ID to resolve to its channel name.
      required:
        - channel_id

  # The 18 read-only Asana tools below mirror roychri/mcp-server-asana's tool set
  # (https://github.com/roychri/mcp-server-asana) one-for-one by name and purpose, but
  # run as custom tools through Django (AgentAsanaCustomToolService, dispatched from
  # AgentCustomToolService) instead of as an MCP server — see the mcp_servers comment
  # above for why. Every one of them enforces constants.WHITELISTED_ASANA_WORKSPACES /
  # WHITELISTED_ASANA_PROJECTS itself before ever calling Asana:
  #   - Tools that take workspace_gid/project_gid directly check it against the
  #     whitelist up front (asana_get_project, asana_get_tasks_for_project, ...).
  #   - Tools that only take a tag/section/task gid (which carry no workspace/project
  #     field of their own) resolve to the governing workspace/project first, then
  #     check that (asana_get_tag, asana_get_task, asana_get_subtasks, ...).
  #   - asana_list_workspaces and asana_search_projects filter their *results* down to
  #     the whitelist too, the same reason Slack's channels_list is excluded above —
  #     enumerating everything the token can see would leak names outside scope.
  #   - asana_search_tasks forces projects.any to the whitelisted project(s) regardless
  #     of what's passed in, so a workspace-wide search can't surface other projects.
  #   - The one exception is asana_get_project_status: Asana's own
  #     `/project_statuses/{gid}` record carries no project/workspace reference at all,
  #     so there is nothing to resolve and check — its description below says plainly
  #     that it must only be called on a gid already surfaced by a whitelist-checked
  #     asana_get_project_statuses call, never a bare gid from elsewhere.
  # Write tools (create/update/delete/complete/comment/move) are not implemented at
  # all — there is no recipe for them anywhere in this file or in agent/services/asana/.
  - type: custom
    name: asana_list_workspaces
    description: >-
      List the Asana workspaces this agent can see — filtered down to only the
      whitelisted workspace(s); a workspace outside that whitelist is never named
      in the result even if the underlying token can see it.
    input_schema:
      type: object
      properties: {}

  - type: custom
    name: asana_search_projects
    description: >-
      Find projects in a workspace by regex name match. Requires a whitelisted
      workspace_gid. Results are filtered to whitelisted projects only — a name
      match against a project outside constants.py's whitelist is dropped, not
      surfaced.
    input_schema:
      type: object
      properties:
        workspace_gid:
          type: string
          description: A whitelisted Asana workspace gid.
        name_pattern:
          type: string
          description: Regular expression matched against each project's name.
        archived:
          type: boolean
          description: Optional. Filter to archived (true) or active (false) projects only.
      required:
        - workspace_gid
        - name_pattern

  - type: custom
    name: asana_search_tasks
    description: >-
      Asana's premium advanced task search (`/workspaces/{gid}/tasks/search`),
      scoped to a whitelisted workspace_gid. Always restricted to the whitelisted
      project(s) regardless of what's asked for — narrower than a full
      workspace-wide search by design. Premium-only and capped at 100
      unstable-ordered results on Asana's side; for exhaustive listing within one
      project prefer asana_get_tasks_for_project instead.
    input_schema:
      type: object
      properties:
        workspace_gid:
          type: string
          description: A whitelisted Asana workspace gid.
        text:
          type: string
          description: Free-text search term.
        assignee_any:
          type: string
          description: Comma-separated user gids (or "me") — matches any of them.
        completed:
          type: boolean
          description: Filter to completed (true) or incomplete (false) tasks only.
        projects_any:
          type: array
          items:
            type: string
          description: >-
            Optional. Narrow further to these project gids — any not on the
            whitelist is dropped rather than rejecting the whole call. Omit to
            search every whitelisted project.
        sort_by:
          type: string
          enum:
            - due_date
            - created_at
            - completed_at
            - modified_at
            - likes
          description: Field to sort results by.
        sort_ascending:
          type: boolean
          description: Sort direction; defaults to descending.
        opt_fields:
          type: string
          description: Comma-separated Asana opt_fields to return, in place of the default set.
      required:
        - workspace_gid

  - type: custom
    name: asana_get_task
    description: >-
      Get one task's detail by gid. This endpoint carries no workspace/project
      field of its own, so the task's project/workspace membership is resolved
      and checked against the whitelist before anything is returned — a task
      outside scope is refused, not merely discouraged by these instructions.
    input_schema:
      type: object
      properties:
        task_gid:
          type: string
          description: The task's gid.
        opt_fields:
          type: string
          description: Comma-separated Asana opt_fields to return, in place of the default set.
      required:
        - task_gid

  - type: custom
    name: asana_get_task_stories
    description: >-
      Get a task's comments and system activity (stories). Same whitelist check
      as asana_get_task — resolved via the task's project/workspace membership.
    input_schema:
      type: object
      properties:
        task_gid:
          type: string
          description: The task's gid.
      required:
        - task_gid

  - type: custom
    name: asana_get_project
    description: >-
      Get one project's detail by gid. Requires a whitelisted project_gid.
    input_schema:
      type: object
      properties:
        project_gid:
          type: string
          description: A whitelisted Asana project gid.
        opt_fields:
          type: string
          description: Comma-separated Asana opt_fields to return, in place of the default set.
      required:
        - project_gid

  - type: custom
    name: asana_get_project_task_counts
    description: >-
      Get a project's task/milestone counts (total, incomplete, completed).
      Requires a whitelisted project_gid.
    input_schema:
      type: object
      properties:
        project_gid:
          type: string
          description: A whitelisted Asana project gid.
      required:
        - project_gid

  - type: custom
    name: asana_get_project_sections
    description: >-
      List a project's sections. Requires a whitelisted project_gid.
    input_schema:
      type: object
      properties:
        project_gid:
          type: string
          description: A whitelisted Asana project gid.
      required:
        - project_gid

  - type: custom
    name: asana_get_multiple_tasks_by_gid
    description: >-
      Batch-fetch up to 25 tasks by gid in one call. Each gid is checked
      individually against the whitelist (via its project/workspace membership) —
      a mixed batch returns only the tasks that resolve to scope, with the rest
      reported back by gid under skipped_not_whitelisted rather than silently
      dropped.
    input_schema:
      type: object
      properties:
        task_gids:
          type: array
          items:
            type: string
          description: Up to 25 task gids.
        opt_fields:
          type: string
          description: Comma-separated Asana opt_fields to return, in place of the default set.
      required:
        - task_gids

  - type: custom
    name: asana_get_project_status
    description: >-
      Get one project status update by its own gid. Asana's project-status
      record carries no project/workspace reference of its own, so this is the
      one tool in this set with no code-level whitelist check — only call it on
      a status gid already returned by a whitelist-checked
      asana_get_project_statuses call, never on a bare gid from anywhere else.
    input_schema:
      type: object
      properties:
        project_status_gid:
          type: string
          description: >-
            A project-status gid, obtained from a prior asana_get_project_statuses
            call on a whitelisted project — never pass one from another source.
      required:
        - project_status_gid

  - type: custom
    name: asana_get_project_statuses
    description: >-
      List a project's status updates. Requires a whitelisted project_gid.
    input_schema:
      type: object
      properties:
        project_gid:
          type: string
          description: A whitelisted Asana project gid.
      required:
        - project_gid

  - type: custom
    name: asana_get_tag
    description: >-
      Get one tag's detail by gid. A tag carries only a workspace, not a
      project, so this resolves the tag's workspace and checks it against the
      whitelist first.
    input_schema:
      type: object
      properties:
        tag_gid:
          type: string
          description: The tag's gid.
      required:
        - tag_gid

  - type: custom
    name: asana_get_tags_for_task
    description: >-
      List the tags on a task. Same whitelist check as asana_get_task —
      resolved via the task's project/workspace membership.
    input_schema:
      type: object
      properties:
        task_gid:
          type: string
          description: The task's gid.
      required:
        - task_gid

  - type: custom
    name: asana_get_tasks_for_tag
    description: >-
      List tasks carrying a tag. A tag carries only a workspace, so this
      resolves the tag's workspace and checks it against the whitelist first.
    input_schema:
      type: object
      properties:
        tag_gid:
          type: string
          description: The tag's gid.
        opt_fields:
          type: string
          description: Comma-separated Asana opt_fields to return, in place of the default set.
      required:
        - tag_gid

  - type: custom
    name: asana_get_tags_for_workspace
    description: >-
      List every tag defined in a workspace. Requires a whitelisted workspace_gid.
    input_schema:
      type: object
      properties:
        workspace_gid:
          type: string
          description: A whitelisted Asana workspace gid.
      required:
        - workspace_gid

  - type: custom
    name: asana_get_subtasks
    description: >-
      List a task's subtasks. Same whitelist check as asana_get_task — resolved
      via the parent task's project/workspace membership.
    input_schema:
      type: object
      properties:
        task_gid:
          type: string
          description: The parent task's gid.
      required:
        - task_gid

  - type: custom
    name: asana_get_tasks_for_project
    description: >-
      List every task in a project, fully paginated — the free-plan-friendly
      alternative to asana_search_tasks when you want everything in one
      whitelisted project rather than a filtered/keyword search.
    input_schema:
      type: object
      properties:
        project_gid:
          type: string
          description: A whitelisted Asana project gid.
        completed_since:
          type: string
          description: >-
            ISO 8601 timestamp, or "now" to return only incomplete tasks. Omit to
            include tasks regardless of completion state.
        opt_fields:
          type: string
          description: Comma-separated Asana opt_fields to return, in place of the default set.
        limit:
          type: integer
          description: Maximum tasks to fetch (default 100; use a higher value for exhaustive listing).
      required:
        - project_gid

  - type: custom
    name: asana_get_my_tasks
    description: >-
      List the caller's own tasks in a workspace (Asana's per-workspace "My
      Tasks" list). Requires a whitelisted workspace_gid.
    input_schema:
      type: object
      properties:
        workspace_gid:
          type: string
          description: A whitelisted Asana workspace gid.
        completed_since:
          type: string
          description: >-
            ISO 8601 timestamp, or "now" to return only incomplete tasks. Omit to
            include tasks regardless of completion state.
        opt_fields:
          type: string
          description: Comma-separated Asana opt_fields to return, in place of the default set.
        limit:
          type: integer
          description: Maximum tasks to fetch (default 100).
      required:
        - workspace_gid

  # A scratchpad for collating results. The environment has no egress, so these
  # cannot reach the network. `read` is load-bearing: MCP outputs over ~100,000
  # characters are offloaded to a file in the sandbox with only a preview in
  # context, and without it large channel histories are unreachable.
  - type: agent_toolset_20260401
    default_config:
      enabled: true
    configs:
      - name: web_fetch
        enabled: false
      - name: web_search
        enabled: false

# Skills available to the agent, pushed via `ant beta:skills` (see
# cma/scripts/upload_skills.sh, which uploads each cma/skills/<name>/ folder
# and prints the skill_id + version to put here). cma/skills/slack-search/
# (how to use search_whitelisted_channels/channels_list/conversations_history/
# conversations_replies/users_search together — see its SKILL.md) has been
# uploaded as skill_01XK8vXMR1rQEVnNAFffTHAp, version 1 — recorded in
# cma/skills/.manifest.json. Editing SKILL.md and re-running
# `cma/scripts/upload_skills.sh slack-search` pushes a new version; `latest`
# below picks that up automatically without editing this file again.
# skills:
#   - type: custom
#     skill_id: skill_01XK8vXMR1rQEVnNAFffTHAp
