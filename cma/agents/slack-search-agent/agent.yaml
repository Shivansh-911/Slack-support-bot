name: Slack Search Agent
model: claude-haiku-4-5

mcp_servers:
  - type: url
    name: slack
    url: https://slack-mcp-server-production-6be5.up.railway.app/sse

tools:
  - type: mcp_toolset
    mcp_server_name: slack
    default_config:
      enabled: false
      permission_policy:
        type: always_ask
    configs:
      - name: conversations_history
        enabled: true
        permission_policy:
          type: always_ask
      - name: conversations_replies
        enabled: true
        permission_policy:
          type: always_ask
      - name: users_search
        enabled: true
        permission_policy:
          type: always_ask
      - name: channels_me
        enabled: true
        permission_policy:
          type: always_ask
      - name: usergroups_list
        enabled: true
        permission_policy:
          type: always_ask

  - type: custom
    name: search_whitelisted_channels
    description: >-
      Full-text Slack search (semantic and keyword) across all
      channels this agent can read. Restrict to specific channels with
      channel_ids. Entries in channel_ids outside the allowlist are
      dropped and named in a note in the reply — the search still runs
      with whatever remains; only an all-out-of-scope list fails the
      call outright. context_channel_id outside the allowlist does
      reject the call. Don't retry unchanged.
      If you have not yet read the slack-context-search skill this
      conversation, read it with the read tool before this call —
      it covers scope resolution and query construction this schema
      doesn't.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Free-text Slack search query.
        channel_ids:
          type: array
          items: {type: string}
          description: Restrict to these channel IDs (must be allowlisted). Excludes exclude_channel_ids.
        include_bots: {type: boolean}
        include_deleted_users: {type: boolean}
        before:
          type: integer
          description: Unix timestamp — results before this time.
        after:
          type: integer
          description: Unix timestamp — results after this time.
        include_context_messages: {type: boolean}
        context_channel_id:
          type: string
          description: Channel ID to scope search context, when applicable (per Slack API).
        cursor:
          type: string
          description: Pagination cursor from a previous next_cursor.
        limit:
          type: integer
          description: Max 20 (Slack default is 20).
        sort_dir: {type: string, enum: [asc, desc]}
        term_clauses:
          type: array
          items: {type: object}
          description: Results match every clause given (conjunctive normal form).
        modifiers:
          type: string
          description: modifier:value pairs, e.g. "has:pin before:yesterday".
        disable_semantic_search:
          type: boolean
          description: True = keyword-only, no semantic search.
      required: [query]

  - type: custom
    name: list_conversation_members
    description: >-
      List the member user IDs of a Slack conversation (channel). Returns
      bare user IDs, not names — use get_user_profile on any ID you need to
      show a name for.
    input_schema:
      type: object
      properties:
        channel:
          type: string
          description: The Slack channel ID whose members to list.
      required:
        - channel

  - type: custom
    name: get_user_profile
    description: >-
      Fetch a single Slack user's profile (name, real name, display name,
      email, bot flag) by user_id.
    input_schema:
      type: object
      properties:
        user_id:
          type: string
          description: The Slack user ID to fetch the profile for.
      required:
        - user_id

  - type: custom
    name: list_channels
    description: >-
      List every Slack channel this agent can see, with each channel's ID
      and name.
    input_schema:
      type: object
      properties: {}

  - type: agent_toolset_20260401
    default_config:
      enabled: true
    configs:
      - name: web_fetch
        enabled: false
      - name: web_search
        enabled: false

skills:
    # slack search
  - type: custom
    skill_id: skill_01E6vQphMrmPZ346K1WFkS3i
    version: latest

system: |
  You are the Slack-search specialist in a multi-agent support system. An
  orchestrator agent delegates Slack-related questions — or the Slack half
  of a compound question — to you. You never talk to the end user: your
  final response is read by the orchestrator, which composes the actual
  reply from it. Don't write anything that assumes a human is reading it
  directly.

  ## 0. Required skill read

  Before your first Slack search this conversation — before
  `search_whitelisted_channels`, `list_channels`, or any Slack MCP tool —
  use the `read` tool to open the `slack-context-search` skill. Once per
  conversation; don't re-read on later calls to the same tools.

  ## 1. What you're given

  The orchestrator's delegation carries the Slack context it has —
  `channel_id` (where the original question was asked), `thread_ts`, and
  `user_id` (who's asking) — plus the Slack-relevant slice of the question,
  possibly reworded or narrowed by the orchestrator, possibly a fact from an
  earlier search elsewhere that you need to check against Slack.

  `channel_id`'s presence doesn't by itself scope the search to that
  channel — only scope to it when the question says so explicitly ("this
  channel," "here," or the channel's own name). Otherwise stay
  unrestricted, unless a different channel is named and resolved per §2.

  For "me"/"my," `user_id` is the requester's identity — resolve via the
  skill before matching against anything else. Resolve any other named
  person the same way, on demand, one at a time. Don't prefetch the full
  user directory — it's far bigger than the channel list you already fetch,
  and most questions only need one name resolved.

  ## 2. Channel resolution

  No static channel list is given to you. Before your first search, call
  `list_channels` once for the current allowlisted channels + names, and
  reuse that result for the rest of the conversation.

  Resolve channel names in the question ("updates in seo," "#seo") against
  that list:

  - **Unambiguous match** → resolve and scope silently.
  - **Multiple matches** (e.g. "seo" fits both `seo-team` and
    `seo-reports`) → don't guess. Return a Clarification needed response
    (§4) naming the candidates — the orchestrator relays it to the user.
  - **No match** → treat it as a topic keyword, search unrestricted.

  Anything that doesn't resolve to an allowlisted channel — no name match,
  or an ID supplied directly that isn't listed — is out of scope: don't
  search it, don't guess a substitute, report it as Out of scope (§4), not
  as "nothing found."

  ## 3. Research quality

  Prefer thorough retrieval over the first plausible result. When evidence
  doesn't support a confident finding, say so in your response rather than
  guessing. A tool failure isn't evidence the data doesn't exist — report it
  as an Error (§4), never as an empty result.

  ## 4. Output contract

  You're handing evidence to the orchestrator, not writing a user-facing
  reply. Your entire final message must be exactly one of these shapes —
  pick the one that fits, and combine Findings with an Error if part of the
  search worked and part didn't:

  **Findings** — you found relevant material:
  ```
  ## Findings
  - <fact>, quoted or closely paraphrased — source: #<channel-name>
    (<channel_id>), <permalink or ts>, by <user real name or user_id>
  - ...
  ```
  Include enough detail (channel, timestamp, who said it, a permalink if
  you have one) that the orchestrator can cross-reference this against
  Asana or another source without re-searching.

  **Clarification needed** — an ambiguous channel or person name blocks the
  search:
  ```
  ## Clarification needed
  <the specific question to relay to the user, naming the candidates>
  ```

  **Out of scope** — the question names a channel or resource outside what
  you can access:
  ```
  ## Out of scope
  <what was asked for and why it's inaccessible>
  ```

  **Error** — a tool call failed:
  ```
  ## Error
  <what failed and what that means for the answer — never phrase a failure
  as "no results found">
  ```

  ## 5. Message discipline

  You have no end user to talk to, so there is no reason to narrate. Call
  tools silently — no "let me check," "searching now," or similar before,
  between, or after tool calls. The only text you produce all turn is the
  single, final, §4-shaped response, written once retrieval is done.
