name: Slack Support Agent
model: claude-haiku-4-5

mcp_servers:
  - type: url
    name: slack
    url: https://slack-mcp-server-production-6be5.up.railway.app/sse

tools:
  - type: mcp_toolset
    mcp_server_name: slack
    default_config:
      enabled: false
      permission_policy:
        type: always_ask
    configs:
      # --- Read-only tools: enabled ---
      # Full inventory below cross-checked against korotovsky/slack-mcp-server
      # (master) pkg/server/server.go + pkg/handler/{conversations,channels,
      # usergroups,saved}.go directly, not just the README, on 2026-08-13.
      - name: conversations_history
        enabled: true
        permission_policy:
          type: always_ask
      - name: conversations_replies
        enabled: true
        permission_policy:
          type: always_ask
      - name: users_search
        enabled: true
        permission_policy:
          type: always_ask
      # - name: conversations_unreads
      #   enabled: true
      #   permission_policy:
      #     type: always_ask
      - name: channels_me
        enabled: true
        permission_policy:
          type: always_ask
      - name: usergroups_list
        enabled: true
        permission_policy:
          type: always_ask
      # - name: saved_list
      #   enabled: true
      #   permission_policy:
      #     type: always_ask



  - type: custom
    name: search_whitelisted_channels
    description: >-
      Full-text Slack search (semantic and keyword) across all
      channels this agent can read. Restrict to specific channels with
      channel_ids. Entries in channel_ids outside the allowlist are
      dropped and named in a note in the reply — the search still runs
      with whatever remains; only an all-out-of-scope list fails the
      call outright. context_channel_id outside the allowlist does
      reject the call. Don't retry unchanged.
      If you have not yet read the slack-context-search skill this
      conversation, read it with the read tool before this call —
      it covers scope resolution and query construction this schema
      doesn't.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Free-text Slack search query.
        channel_ids:
          type: array
          items: {type: string}
          description: Restrict to these channel IDs (must be allowlisted). Excludes exclude_channel_ids.
        include_bots: {type: boolean}
        include_deleted_users: {type: boolean}
        before:
          type: integer
          description: Unix timestamp — results before this time.
        after:
          type: integer
          description: Unix timestamp — results after this time.
        include_context_messages: {type: boolean}
        context_channel_id:
          type: string
          description: Channel ID to scope search context, when applicable (per Slack API).
        cursor:
          type: string
          description: Pagination cursor from a previous next_cursor.
        limit:
          type: integer
          description: Max 20 (Slack default is 20).
        # sort: {type: string, enum: [score, timestamp]}
        sort_dir: {type: string, enum: [asc, desc]}
        # include_message_blocks: {type: boolean}
        term_clauses:
          type: array
          items: {type: object}
          description: Results match every clause given (conjunctive normal form).
        modifiers:
          type: string
          description: modifier:value pairs, e.g. "has:pin before:yesterday".
        # include_archived_channels: {type: boolean}
        disable_semantic_search:
          type: boolean
          description: True = keyword-only, no semantic search.
      required: [query]

  # Custom tool: wraps `conversations.members` — the member user ID list for
  # one conversation. Returns bare IDs only, no names; pair with
  # get_user_profile to resolve any of them to a name.
  - type: custom
    name: list_conversation_members
    description: >-
      List the member user IDs of a Slack conversation (channel). Returns
      bare user IDs, not names — use get_user_profile on any ID you need to
      show a name for.
    input_schema:
      type: object
      properties:
        channel:
          type: string
          description: The Slack channel ID whose members to list.
      required:
        - channel

  # Custom tool: wraps `users.info` — a single user's profile by ID. The
  # counterpart to list_conversation_members and to any other tool output
  # (search results, conversation history) that surfaces a bare user_id.
  - type: custom
    name: get_user_profile
    description: >-
      Fetch a single Slack user's profile (name, real name, display name,
      email, bot flag) by user_id.
    input_schema:
      type: object
      properties:
        user_id:
          type: string
          description: The Slack user ID to fetch the profile for.
      required:
        - user_id

  # Custom tool: lists every channel SlackChannelService knows about (its
  # id-to-name cache, built from `conversations.list` via
  # agent/services/slack/slack_channel_service.py). No whitelist filtering —
  # see that file's docstring; allowlist scoping is being reworked elsewhere
  # and isn't wired back in yet.
  - type: custom
    name: list_channels
    description: >-
      List every Slack channel this agent can see, with each channel's ID
      and name.
    input_schema:
      type: object
      properties: {}

  # The 18 read-only Asana tools below mirror roychri/mcp-server-asana's tool set
  # (https://github.com/roychri/mcp-server-asana) one-for-one by name and purpose, but
  # run as custom tools through Django (AgentAsanaCustomToolService, dispatched from
  # AgentCustomToolService) instead of as an MCP server — see the mcp_servers comment
  # above for why. Every one of them enforces constants.WHITELISTED_ASANA_WORKSPACES /
  # WHITELISTED_ASANA_PROJECTS itself before ever calling Asana:
  #   - Tools that take workspace_gid/project_gid directly check it against the
  #     whitelist up front (asana_get_project, asana_get_tasks_for_project, ...).
  #   - Tools that only take a tag/section/task gid (which carry no workspace/project
  #     field of their own) resolve to the governing workspace/project first, then
  #     check that (asana_get_tag, asana_get_task, asana_get_subtasks, ...).
  #   - asana_list_workspaces and asana_search_projects filter their *results* down to
  #     the whitelist too, the same reason Slack's channels_list is excluded above —
  #     enumerating everything the token can see would leak names outside scope.
  #   - asana_search_tasks forces projects.any to the whitelisted project(s) regardless
  #     of what's passed in, so a workspace-wide search can't surface other projects.
  #   - The one exception is asana_get_project_status: Asana's own
  #     `/project_statuses/{gid}` record carries no project/workspace reference at all,
  #     so there is nothing to resolve and check — its description below says plainly
  #     that it must only be called on a gid already surfaced by a whitelist-checked
  #     asana_get_project_statuses call, never a bare gid from elsewhere.
  # Write tools (create/update/delete/complete/comment/move) are not implemented at
  # all — there is no recipe for them anywhere in this file or in agent/services/asana/.
  - type: custom
    name: asana_list_workspaces
    description: >-
      List the Asana workspaces this agent can see — filtered down to only the
      whitelisted workspace(s); a workspace outside that whitelist is never named
      in the result even if the underlying token can see it.
    input_schema:
      type: object
      properties: {}

  - type: custom
    name: asana_search_projects
    description: >-
      Find projects in a workspace by regex name match. Requires a whitelisted
      workspace_gid. Results are filtered to whitelisted projects only — a name
      match against a project outside constants.py's whitelist is dropped, not
      surfaced.
      If you have not yet read the asana-search skill this conversation,
      read it with the read tool before this call.
    input_schema:
      type: object
      properties:
        workspace_gid:
          type: string
          description: A whitelisted Asana workspace gid.
        name_pattern:
          type: string
          description: Regular expression matched against each project's name.
        archived:
          type: boolean
          description: Optional. Filter to archived (true) or active (false) projects only.
      required:
        - workspace_gid
        - name_pattern

  - type: custom
    name: asana_search_tasks
    description: >-
      Asana's premium advanced task search (`/workspaces/{gid}/tasks/search`),
      scoped to a whitelisted workspace_gid. Always restricted to the whitelisted
      project(s) regardless of what's asked for — narrower than a full
      workspace-wide search by design. Premium-only and capped at 100
      unstable-ordered results on Asana's side; for exhaustive listing within one
      project prefer asana_get_tasks_for_project instead.
      If you have not yet read the asana-search skill this conversation,
      read it with the read tool before this call.
    input_schema:
      type: object
      properties:
        workspace_gid:
          type: string
          description: A whitelisted Asana workspace gid.
        text:
          type: string
          description: Free-text search term.
        assignee_any:
          type: string
          description: Comma-separated user gids (or "me") — matches any of them.
        completed:
          type: boolean
          description: Filter to completed (true) or incomplete (false) tasks only.
        projects_any:
          type: array
          items:
            type: string
          description: >-
            Optional. Narrow further to these project gids — any not on the
            whitelist is dropped rather than rejecting the whole call. Omit to
            search every whitelisted project.
        sort_by:
          type: string
          enum:
            - due_date
            - created_at
            - completed_at
            - modified_at
            - likes
          description: Field to sort results by.
        sort_ascending:
          type: boolean
          description: Sort direction; defaults to descending.
        opt_fields:
          type: string
          description: Comma-separated Asana opt_fields to return, in place of the default set.
      required:
        - workspace_gid

  - type: custom
    name: asana_get_task
    description: >-
      Get one task's detail by gid. This endpoint carries no workspace/project
      field of its own, so the task's project/workspace membership is resolved
      and checked against the whitelist before anything is returned — a task
      outside scope is refused, not merely discouraged by these instructions.
    input_schema:
      type: object
      properties:
        task_gid:
          type: string
          description: The task's gid.
        opt_fields:
          type: string
          description: Comma-separated Asana opt_fields to return, in place of the default set.
      required:
        - task_gid

  - type: custom
    name: asana_get_task_stories
    description: >-
      Get a task's comments and system activity (stories). Same whitelist check
      as asana_get_task — resolved via the task's project/workspace membership.
    input_schema:
      type: object
      properties:
        task_gid:
          type: string
          description: The task's gid.
      required:
        - task_gid

  - type: custom
    name: asana_get_project
    description: >-
      Get one project's detail by gid. Requires a whitelisted project_gid.
    input_schema:
      type: object
      properties:
        project_gid:
          type: string
          description: A whitelisted Asana project gid.
        opt_fields:
          type: string
          description: Comma-separated Asana opt_fields to return, in place of the default set.
      required:
        - project_gid

  - type: custom
    name: asana_get_project_task_counts
    description: >-
      Get a project's task/milestone counts (total, incomplete, completed).
      Requires a whitelisted project_gid.
    input_schema:
      type: object
      properties:
        project_gid:
          type: string
          description: A whitelisted Asana project gid.
      required:
        - project_gid

  - type: custom
    name: asana_get_project_sections
    description: >-
      List a project's sections. Requires a whitelisted project_gid.
    input_schema:
      type: object
      properties:
        project_gid:
          type: string
          description: A whitelisted Asana project gid.
      required:
        - project_gid

  - type: custom
    name: asana_get_multiple_tasks_by_gid
    description: >-
      Batch-fetch up to 25 tasks by gid in one call. Each gid is checked
      individually against the whitelist (via its project/workspace membership) —
      a mixed batch returns only the tasks that resolve to scope, with the rest
      reported back by gid under skipped_not_whitelisted rather than silently
      dropped.
    input_schema:
      type: object
      properties:
        task_gids:
          type: array
          items:
            type: string
          description: Up to 25 task gids.
        opt_fields:
          type: string
          description: Comma-separated Asana opt_fields to return, in place of the default set.
      required:
        - task_gids

  - type: custom
    name: asana_get_project_status
    description: >-
      Get one project status update by its own gid. Asana's project-status
      record carries no project/workspace reference of its own, so this is the
      one tool in this set with no code-level whitelist check — only call it on
      a status gid already returned by a whitelist-checked
      asana_get_project_statuses call, never on a bare gid from anywhere else.
    input_schema:
      type: object
      properties:
        project_status_gid:
          type: string
          description: >-
            A project-status gid, obtained from a prior asana_get_project_statuses
            call on a whitelisted project — never pass one from another source.
      required:
        - project_status_gid

  - type: custom
    name: asana_get_project_statuses
    description: >-
      List a project's status updates. Requires a whitelisted project_gid.
    input_schema:
      type: object
      properties:
        project_gid:
          type: string
          description: A whitelisted Asana project gid.
      required:
        - project_gid

  - type: custom
    name: asana_get_tag
    description: >-
      Get one tag's detail by gid. A tag carries only a workspace, not a
      project, so this resolves the tag's workspace and checks it against the
      whitelist first.
    input_schema:
      type: object
      properties:
        tag_gid:
          type: string
          description: The tag's gid.
      required:
        - tag_gid

  - type: custom
    name: asana_get_tags_for_task
    description: >-
      List the tags on a task. Same whitelist check as asana_get_task —
      resolved via the task's project/workspace membership.
    input_schema:
      type: object
      properties:
        task_gid:
          type: string
          description: The task's gid.
      required:
        - task_gid

  - type: custom
    name: asana_get_tasks_for_tag
    description: >-
      List tasks carrying a tag. A tag carries only a workspace, so this
      resolves the tag's workspace and checks it against the whitelist first.
    input_schema:
      type: object
      properties:
        tag_gid:
          type: string
          description: The tag's gid.
        opt_fields:
          type: string
          description: Comma-separated Asana opt_fields to return, in place of the default set.
      required:
        - tag_gid

  - type: custom
    name: asana_get_tags_for_workspace
    description: >-
      List every tag defined in a workspace. Requires a whitelisted workspace_gid.
    input_schema:
      type: object
      properties:
        workspace_gid:
          type: string
          description: A whitelisted Asana workspace gid.
      required:
        - workspace_gid

  - type: custom
    name: asana_get_subtasks
    description: >-
      List a task's subtasks. Same whitelist check as asana_get_task — resolved
      via the parent task's project/workspace membership.
    input_schema:
      type: object
      properties:
        task_gid:
          type: string
          description: The parent task's gid.
      required:
        - task_gid

  - type: custom
    name: asana_get_tasks_for_project
    description: >-
      List every task in a project, fully paginated — the free-plan-friendly
      alternative to asana_search_tasks when you want everything in one
      whitelisted project rather than a filtered/keyword search.
      If you have not yet read the asana-search skill this conversation,
      read it with the read tool before this call.
    input_schema:
      type: object
      properties:
        project_gid:
          type: string
          description: A whitelisted Asana project gid.
        completed_since:
          type: string
          description: >-
            ISO 8601 timestamp, or "now" to return only incomplete tasks. Omit to
            include tasks regardless of completion state.
        opt_fields:
          type: string
          description: Comma-separated Asana opt_fields to return, in place of the default set.
        limit:
          type: integer
          description: Maximum tasks to fetch (default 100; use a higher value for exhaustive listing).
      required:
        - project_gid

  - type: custom
    name: asana_get_my_tasks
    description: >-
      List the caller's own tasks in a workspace (Asana's per-workspace "My
      Tasks" list). Requires a whitelisted workspace_gid.
      If you have not yet read the asana-search skill this conversation,
      read it with the read tool before this call.
    input_schema:
      type: object
      properties:
        workspace_gid:
          type: string
          description: A whitelisted Asana workspace gid.
        completed_since:
          type: string
          description: >-
            ISO 8601 timestamp, or "now" to return only incomplete tasks. Omit to
            include tasks regardless of completion state.
        opt_fields:
          type: string
          description: Comma-separated Asana opt_fields to return, in place of the default set.
        limit:
          type: integer
          description: Maximum tasks to fetch (default 100).
      required:
        - workspace_gid

  # A scratchpad for collating results. The environment has no egress, so these
  # cannot reach the network. `read` is load-bearing: MCP outputs over ~100,000
  # characters are offloaded to a file in the sandbox with only a preview in
  # context, and without it large channel histories are unreachable.
  - type: agent_toolset_20260401
    default_config:
      enabled: true
    configs:
      - name: web_fetch
        enabled: false
      - name: web_search
        enabled: false

# Skills available to the agent, pushed via `ant beta:skills` (see
# cma/scripts/upload_skills.sh, which uploads each cma/skills/<name>/ folder
# and prints the skill_id + version to put here). cma/skills/slack-search/
# (how to use search_whitelisted_channels/channels_list/conversations_history/
# conversations_replies/users_search together — see its SKILL.md) has been
# uploaded as skill_01XK8vXMR1rQEVnNAFffTHAp, version 1 — recorded in
# cma/skills/.manifest.json. Editing SKILL.md and re-running
# `cma/scripts/upload_skills.sh slack-search` pushes a new version; `latest`
# below picks that up automatically without editing this file again.
# skills:
#   - type: custom
#     skill_id: skill_01XK8vXMR1rQEVnNAFffTHAp
#     version: latest
#   - type: custom
#     skill_id: skill_01LkxXWD9Ftota86BEj7uBby
#     version: latest

skills:
      # slack search 
    - type: custom
      skill_id: skill_01E6vQphMrmPZ346K1WFkS3i
      version: latest
      # asana skill
    - type: custom
      skill_id: skill_01LkxXWD9Ftota86BEj7uBby
      version: latest
      # answering 
    - type: custom
      skill_id: skill_012j8tyCunh8etLjAqYXmMwz
      version: latest

system: |
  You are a support agent for an engineering team. You answer questions
  using Slack and Asana activity.

  ## 0. Required skill reads

  Three of your skills are required steps, not optional background
  reading — skip one and the corresponding output gets worse, even
  though you already know how to call the underlying tools:

  - **Before your first Slack search this conversation** — before
    `search_whitelisted_channels`, `list_channels`, or any Slack MCP
    tool — use the `read` tool to open the `slack-context-search` skill.
  - **Before your first Asana call this conversation** — before any
    `asana_*` tool — use the `read` tool to open the `asana-search`
    skill.
  - **Before every final answer you send the user, with no exception** —
    use the `read` tool to open the `answering` skill and follow it.

  Each of these fires at most once per conversation for the Slack/Asana
  reads (don't re-read on later calls to the same source), but the
  answering-skill read happens on every single turn that ends in a reply
  to the user, not just the first.

  Treat the answering-skill read as a hard precondition on the act of
  replying, not a reminder to keep in mind earlier in the turn. The moment
  you start drafting the user-facing message, check: did I open `answering`
  already *this turn*? If you can't point to having done so, stop drafting
  and open it now before continuing. A short reply, a question you've
  answered before, or high confidence in the answer is never a reason to
  skip it — those are exactly the cases where it's easiest to skip and
  where a raw ID or an untrimmed answer slips through.

  ## 1. Sources

  Classify per clause, not per message — a single question can carry more
  than one source. Naming a Slack channel ("across the seo channel," "in
  #seo") only scopes the Slack half of the question; it never by itself
  rules out Asana for the rest of it.

  Treat any of these as an explicit Asana signal, regardless of what else
  is in the same message: "ticket," "support ticket," "task," "issue,"
  "asana," "assigned," "due," "tracked," or a question asking whether
  something is *linked to* / *associated with* / *filed as* some other
  record. A message that names a Slack channel AND uses one of these
  words is not "clearly Slack" — it's a compound question: search Slack
  for the channel/topic half, and search Asana for the
  ticket/task/tracking half, then connect the two (e.g. resolve the
  Slack thread's topic or participants, then check Asana for a
  matching task).

  Otherwise: clearly Slack → use Slack. Clearly Asana → use Asana.
  Ambiguous (e.g. "status of X," "did anyone mention Y") → use both,
  cross-referencing — if one source sharpens the search in the other, use
  it. If they disagree (Asana says done, Slack shows active discussion),
  surface both rather than silently picking one.

  ## 2. Slack context

  Every message begins with:

    [Slack context]
    channel_id: C...
    thread_ts: ...
    user_id: U...

    <question>

  Metadata, not part of the question. `channel_id` = where asked,
  `thread_ts` = current thread, `user_id` = who's asking.

  Its presence doesn't by itself scope the search to that channel — only
  scope to it when the question says so explicitly ("this channel,"
  "here," or the channel's own name). Otherwise stay unrestricted, unless
  a different channel is named and resolved per §3.

  For "me"/"my," `user_id` is the requester's identity — resolve via the
  Slack skill before matching against Asana. Resolve any other named
  person the same way, on demand, one at a time. Don't prefetch the full
  user directory — it's far bigger than the channel allowlist you already
  fetch, and most questions only need one name resolved.

  ## 3. Slack allowlist and channel resolution

  No static channel list here. Before the first Slack search, call
  `list_channels` once for the current allowlisted channels + names, and
  reuse that result for the rest of the conversation.

  Resolve channel names in the question ("updates in seo," "#seo") against
  that list:

  - **Unambiguous match** → resolve and scope silently.
  - **Multiple matches** (e.g. "seo" fits both `seo-team` and
    `seo-reports`) → ask which one; guessing would silently misroute the
    search.
  - **No match** → treat it as a topic keyword, search unrestricted.

  Anything that doesn't resolve to an allowlisted channel — no name match,
  or an ID supplied directly that isn't listed — is out of scope: don't
  search it, don't guess a substitute, tell the user it isn't accessible.

  ## 4. Asana allowlist

  Only access:

    workspace_gid: 1203355867603831
    project_gid: 1211134942672045

  Read-only. If asked to create, edit, complete, delete, or comment,
  explain this agent only reads Asana.

  ## 5. Access boundaries

  Both allowlists are hard boundaries — if something's outside them, don't
  reach for another tool or source to get it anyway; say it's out of
  scope. A tool failure isn't evidence the data doesn't exist — report the
  limitation, don't call it "nothing found."

  ## 6. Research quality

  Prefer thorough retrieval over the first plausible result, especially
  on Slack. When evidence doesn't support a confident answer, say so
  rather than guess. See §0 for the required answering-skill read before
  every reply.

  ## 7. Message discipline

  Every piece of text you write is posted to the user as its own, separate
  Slack message the instant you write it — it is not private reasoning,
  not a draft, and nothing groups it with what comes next. Write "let me
  check Slack for that" and that sentence is already in the thread as a
  real message before you've even called a tool. Write another sentence
  like it after the tool result comes back, and that's a second message.
  There is no edit-in-place and no batching — every sentence is its own
  notification landing in front of the user.

  Given that, write no text at all while you are still researching. A tool
  call needs no text before or after it — call it silently. The only text
  you produce in an entire turn is the single, final, answering-skill-
  gated answer (§0), written once, after all retrieval is done and you are
  ready to reply. If the turn ends in a clarifying question instead of an
  answer, that question IS this turn's one message — not an addition to
  it. Nothing precedes the one message and nothing follows it.

  Before writing any sentence, check what it's for. If it describes what
  you're doing or about to do rather than answering the question or asking
  the one clarifying question you need — "checking," "looking into,"
  "let me," "I'll," "searching," "one moment," "give me a second" — don't
  write it. Call the next tool instead.

